<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c39"><title>Teacher Sign In · Ozone Challenge</title>
<style>*{box-sizing:border-box}body{background:radial-gradient(circle at 80% 10%,#174c70,#071731 60%);color:white;min-height:100vh;display:grid;place-items:center;padding:22px;margin:0;font:16px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:440px;width:100%;padding:35px;border:1px solid #ffffff44;border-radius:22px;background:#15365d;box-shadow:0 20px 55px #020f27a6}h1{margin:6px 0 10px;font-size:32px}p{color:#d2e4ed}.accent{color:#83fee0;letter-spacing:.12em;font-weight:850;font-size:12px}label{font-weight:700;display:block;margin:26px 0 9px}input{width:100%;padding:14px;font:inherit;border-radius:12px;border:2px solid #a0cfd6;color:#10283c}button{width:100%;margin-top:17px;background:#80f5df;color:#064c46;font-weight:900;padding:14px;border:0;border-radius:12px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{color:#ffdee2;font-weight:800;min-height:24px;margin-top:10px}.note{font-size:13px}.back{display:inline-block;margin-top:17px;color:#91fff0;text-decoration:none}</style></head>
<body><main><div class="accent">🌍 OZONE CHALLENGE · PRIVATE ACCESS</div><h1>🔒 Teacher dashboard</h1><p>Only the teacher can view the class leaderboard. Students see only their own scores.</p><form id="form"><label for="pw">Teacher password</label><input id="pw" type="password" autocomplete="current-password" required autofocus><button type="submit" id="go">Unlock Leaderboard →</button></form><div class="error" id="error" role="alert"></div><p class="note">Your password is configured privately in Render under <strong>Environment → OZONE_TEACHER_PASSWORD</strong>. Never put it in GitHub.</p><a class="back" href="/">← Back to student quiz</a></main>
<script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),v=document.getElementById('pw').value,m=document.getElementById('error');b.disabled=true;b.textContent='Signing in…';m.textContent='';try{const r=await fetch('/api/teacher/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v}),cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Unable to sign in');location.replace('/teacher')}catch(err){m.textContent=err.message;b.disabled=false;b.textContent='Unlock Leaderboard →'}})</script></body></html>
